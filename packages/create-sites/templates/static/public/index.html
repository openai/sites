<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A dependency-free starter for OpenAI Sites."
    />
    <title>Untitled site</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/script.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">OpenAI Sites</p>
      <h1>Start with the web.</h1>
      <p class="lede">
        Edit the HTML, CSS, and JavaScript in <code>public</code>. There is no
        framework or build step between you and this page.
      </p>
      <button class="button" type="button" data-action="greet">
        Try the interaction
      </button>
      <p class="status" data-status aria-live="polite"></p>
    </main>
  </body>
</html>
